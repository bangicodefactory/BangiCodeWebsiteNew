name: CI

on:
  push:
    branches: [main]
    paths:
      - "next-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "next-app/**"
      - ".github/workflows/ci.yml"

# Skip the entire workflow when the commit message contains [skip ci]
# (GitHub Actions honours this natively on push; handled here for PR title parity)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 runner for all JS actions (mandatory from 2026-06-02)
# IST-201: remove FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 after 2026-06-02
env:
  HUSKY: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    working-directory: ./next-app

# ── Reusable setup ────────────────────────────────────────────────────────────
# Each job that runs code repeats pnpm + Node setup.
# Artifact "next-build" carries the .next/ output from build → smoke/lighthouse.

jobs:
  # ── Job 1: Registry pin freshness ────────────────────────────────────────
  registry-pin:
    name: "Registry pin freshness"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      # Script uses only Node built-ins — no pnpm install needed
      - name: Check registry pin
        run: node scripts/check-registry-pin.mjs
        working-directory: ./next-app

  # ── Job 2: Type · Lint · Format ──────────────────────────────────────────
  quality:
    name: "Quality (typecheck · lint · format)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript — tsc --noEmit
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier — format check
        run: pnpm format:check

  # ── Job 3: Build ─────────────────────────────────────────────────────────
  build:
    name: "Build (next build)"
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: next-app/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('next-app/pnpm-lock.yaml') }}-${{ hashFiles('next-app/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('next-app/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Upload .next/ output (excluding the build cache) for smoke + lighthouse
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            next-app/.next
            !next-app/.next/cache
          retention-days: 1
          include-hidden-files: true

  # ── Job 4: Playwright smoke tests ────────────────────────────────────────
  smoke:
    name: "Smoke (Playwright @smoke)"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: next-app/.next

      - name: Run smoke tests
        run: pnpm test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: next-app/playwright-report/
          retention-days: 7

  # ── Job 5: Lighthouse budget ──────────────────────────────────────────────
  lighthouse:
    name: "Lighthouse budget (≥95 perf/a11y/seo/bp)"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: next-app/.next

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@^0.14.0 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          SITE_URL: http://localhost:3000

      - name: Upload LHCI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-results
          path: next-app/.lighthouseci/
          retention-days: 7
