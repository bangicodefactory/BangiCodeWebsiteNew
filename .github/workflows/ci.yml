name: CI

on:
  push:
    branches: [main]
    paths:
      - "next-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "next-app/**"
      - ".github/workflows/ci.yml"
  # Manual runs, so the first deploy can be triggered without pushing a commit.
  workflow_dispatch:
    inputs:
      skip_live_check:
        description: >-
          Skip the "is the site serving?" check. Use for the FIRST deploy, when
          the cPanel app is still stopped on purpose — the upload succeeds but
          nothing is listening yet, and the check would fail a good deploy.
        type: boolean
        default: false

# Skip the entire workflow when the commit message contains [skip ci]
# (GitHub Actions honours this natively on push; handled here for PR title parity)
#
# Superseding a running PR check is free; superseding a running DEPLOY is not.
# Workflow-level cancellation kills the whole run, and it outranks the deploy
# job's own `cancel-in-progress: false` — so a second push to main while the
# first was mid-rsync would abort the upload with --delete already applied,
# leaving a half-synced tree on the server. Giving main its own non-cancelling
# group is what actually makes that job's guarantee true.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Opt into Node.js 24 runner for all JS actions (mandatory from 2026-06-02)
# IST-201: remove FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 after 2026-06-02
env:
  HUSKY: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    working-directory: ./next-app

# ── Reusable setup ────────────────────────────────────────────────────────────
# Each job that runs code repeats pnpm + Node setup.
# Artifact "next-build" carries the .next/ output from build → smoke/lighthouse.

jobs:
  # ── Job 1: Design token + message catalog integrity ──────────────────────
  tokens:
    name: "Integrity (tokens · i18n parity)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      # Scripts use only Node built-ins — no pnpm install needed

      # Fails if a brand token class is used but not declared in tokens.css.
      # Guards the failure mode described in ADR 0001, where every brand class
      # in the codebase silently compiled to nothing.
      - name: Check design tokens
        run: node scripts/check-tokens.mjs
        working-directory: ./next-app

      # next-intl renders the key path itself when a key is missing, so a gap
      # ships silently — an Arabic page reading "Home.faq.q03" with every other
      # check green. Fails on key drift, empty values, or an English string left
      # sitting in fr/ar.
      - name: Check message catalog parity
        run: node scripts/check-messages-parity.mjs
        working-directory: ./next-app

      # Registry was abandoned (ADR 0001); this now no-ops on status
      # "abandoned" and is kept only so the pin file cannot rot unnoticed.
      - name: Check registry pin
        run: node scripts/check-registry-pin.mjs
        working-directory: ./next-app

  # ── Job 2: Type · Lint · Format ──────────────────────────────────────────
  quality:
    name: "Quality (typecheck · lint · format)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript — tsc --noEmit
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier — format check
        run: pnpm format:check

  # ── Job 3: Build ─────────────────────────────────────────────────────────
  build:
    name: "Build (next build)"
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: next-app/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('next-app/pnpm-lock.yaml') }}-${{ hashFiles('next-app/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('next-app/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SITE_URL must match the origin the smoke and Lighthouse jobs audit.
      # Metadata is baked at build time, so without this every canonical points
      # at https://bangicode.ma while the runner serves localhost — Lighthouse
      # scores a cross-origin canonical as invalid and every URL loses 8 points.
      - name: Build
        run: pnpm build
        env:
          SITE_URL: http://localhost:3000

      # Tarred rather than uploaded as a directory tree, because .next/node_modules
      # holds SYMLINKS into pnpm's content-addressable store and upload-artifact
      # follows symlinks instead of preserving them. That flattening detaches the
      # linked package from its own dependencies: next-mdx-remote resolved fine
      # here and in production, but arrived in the smoke job as a bare directory
      # whose `vfile` import had nowhere to resolve to, so every blog route 500'd
      # in CI only. tar keeps the links, and the consumers extract in place.
      - name: Package build output
        run: tar -cf ../next-build.tar --exclude=./.next/cache ./.next

      # Upload .next/ output (excluding the build cache) for smoke + lighthouse
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar
          retention-days: 1

  # ── Job 4: Playwright smoke tests ────────────────────────────────────────
  #
  # Needs a database. The smoke suite asserts on real content
  # (/en/portfolio/rentcar), and since ADR 0003 that content lives in MySQL
  # rather than in files on disk.
  #
  # MariaDB 11.4, not mysql:8 — verified over SSH on 2026-08-07 that the cPanel
  # account runs MariaDB 11.4.12. Matching the major version is the difference
  # between testing what production runs and testing something adjacent to it,
  # and this project has already been bitten twice by CI and the real
  # environment disagreeing.
  smoke:
    name: "Smoke (Playwright @smoke)"
    runs-on: ubuntu-latest
    needs: build

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: bangicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci
      DB_NAME: bangicode_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack build output
        run: tar -xf ../next-build.tar

      # The content files stayed in the repo precisely so CI has a fixture to
      # seed from — see the note at the top of scripts/seed-from-files.mjs.
      - name: Migrate and seed the database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Run smoke tests
        run: pnpm test:smoke

      # CMS suite — separate config, because it needs a CONFIGURED server while
      # the run above deliberately uses an unconfigured one (which is what
      # admin-auth.spec.ts asserts).
      #
      # Its OWN database, because support.ts truncates between tests and the
      # smoke fixture must survive a retry. Sharing one schema would make the
      # two suites order-dependent, which is a debugging session nobody needs.
      - name: Create the CMS test database
        run: |
          mysql -h 127.0.0.1 -u root -pci -e \
            "CREATE DATABASE IF NOT EXISTS bangicode_cms_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          DB_NAME=bangicode_cms_test pnpm db:migrate

      - name: Run CMS end-to-end tests
        run: pnpm test:cms
        env:
          CMS_TEST_DB: bangicode_cms_test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: next-app/playwright-report/
          retention-days: 7

  # ── Job 5: Lighthouse budget ──────────────────────────────────────────────
  lighthouse:
    name: "Lighthouse budget (≥95 perf/a11y/seo/bp)"
    runs-on: ubuntu-latest
    needs: build

    # Same reason as the smoke job: /en/portfolio and /en/portfolio/rentcar are
    # in the URL list, and an empty database would audit an empty portfolio —
    # which would pass the budget while measuring nothing.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: bangicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci
      DB_NAME: bangicode_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack build output
        run: tar -xf ../next-build.tar

      - name: Migrate and seed the database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@^0.14.0 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          SITE_URL: http://localhost:3000

      - name: Upload LHCI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-results
          path: next-app/.lighthouseci/
          retention-days: 7

  # ── Job 6: Deploy to Namecheap shared hosting ────────────────────────────
  #
  # Builds here, not on the server. Namecheap shared hosting caps per-process
  # memory well below what `next build` needs, and a build that OOMs halfway
  # would take the live site down. Building in CI also means a failing test or
  # type error never reaches production — `needs:` is the gate.
  #
  # Ships a STANDALONE bundle: .next/standalone carries only the traced
  # dependencies, so there is no npm install on the server and nothing to keep
  # in sync. cPanel's Node.js app (Phusion Passenger) runs server.js directly.
  deploy:
    name: "Deploy (cPanel / Passenger)"
    runs-on: ubuntu-latest
    needs: [tokens, quality, smoke, lighthouse]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never interrupt a half-finished upload

    steps:
      # Fails fast with the NAMES of anything missing. Without this, an unset
      # secret surfaces as `ssh: Could not resolve hostname` or an rsync path
      # error several minutes into the job — accurate, but it does not tell you
      # that DEPLOY_HOST was never set.
      - name: Check deploy secrets are configured
        # Runs BEFORE checkout, so it cannot use the workflow's
        # `working-directory: ./next-app` default — that directory does not
        # exist yet and bash refuses to start in it:
        #   "An error occurred trying to start process '/usr/bin/bash' with
        #    working directory '.../next-app'. No such file or directory"
        # The first time this job ever ran, that is how it failed. The
        # workspace root always exists, so pin to it.
        working-directory: .
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # These must be mapped here too, not only listed below. A name in the
          # loop with no matching entry in this block reads as empty and is
          # reported missing — which is exactly what happened: all four DB
          # secrets were set in the repository and the preflight still failed
          # them, sending you to check settings that were already correct.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=""
          # ADMIN_SESSION_SECRET is deliberately absent. The deploy never sends
          # it to the server — the app reads it from the cPanel environment,
          # which CI cannot see. Requiring it here would verify that a value
          # exists somewhere nothing reads, and report "all secrets present"
          # for a server that cannot open a session. Checking the wrong thing
          # is worse than not checking.
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PORT DEPLOY_SSH_KEY DEPLOY_PATH SITE_URL DB_HOST DB_USER DB_NAME DB_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "See docs/DEPLOYMENT.md for what each one holds."
            exit 1
          fi
          case "$SITE_URL" in
            https://*) ;;
            *) echo "::error::SITE_URL must start with https:// (got '$SITE_URL'). The admin session cookie is Secure and will be dropped over plain HTTP."; exit 1 ;;
          esac
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "::error::DEPLOY_PATH must be absolute, e.g. /home/USER/bangicode-app (got '$DEPLOY_PATH')."; exit 1 ;;
          esac
          echo "All deploy secrets present."

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone bundle
        run: BUILD_STANDALONE=1 pnpm build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      # server.js serves public/ and .next/static ONLY if they sit inside the
      # standalone directory — Next does not copy them. Skipping this step
      # produces a site that renders unstyled with every asset 404ing.
      - name: Assemble deployable tree
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          # The migrator and its SQL are NOT traced into the standalone bundle
          # — nothing in the app imports them — but the deploy runs migrations
          # on the server, so they have to be shipped explicitly. Same class of
          # omission as public/ and .next/static above.
          mkdir -p .next/standalone/scripts
          cp scripts/migrate.mjs .next/standalone/scripts/
          cp -r migrations .next/standalone/
          # The admin CLI, so an account can be created or a password reset
          # without a redeploy. It is the only password reset there is.
          cp scripts/create-admin.mjs .next/standalone/scripts/
          # Passenger restarts when this file's mtime changes.
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt
          du -sh .next/standalone

      # DEPLOY_SSH_HOST_KEY is optional. Set it (the server's line from
      # `ssh-keyscan -p PORT HOST`) and the host is pinned; leave it unset and
      # this falls back to trust-on-first-use, which accepts whatever key the
      # network hands back on every single run. Pinning is the difference
      # between authenticating the server and merely hoping.
      - name: Add SSH key
        env:
          HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          # printf, not echo: a key pasted without a trailing newline is rejected
          # by ssh with an unhelpful "invalid format".
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
            echo "host key pinned from DEPLOY_SSH_HOST_KEY"
          else
            echo "::warning::DEPLOY_SSH_HOST_KEY is not set — trusting the host key on first sight. Add it to pin the server."
            ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      # Snapshot the currently-deployed tree so a bad release can be undone.
      # Shared hosting has no atomic swap, so this is the only rollback there is.
      - name: Snapshot the current release
        run: |
          ssh -p "${{ secrets.DEPLOY_SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             APP='${{ secrets.DEPLOY_PATH }}'
             if [ -f \"\$APP/server.js\" ]; then
               rm -rf \"\$APP.prev\"
               cp -a \"\$APP\" \"\$APP.prev\"
               echo 'snapshot taken'
             else
               echo 'no existing release to snapshot (first deploy)'
             fi"

      # --delete keeps the server from accumulating removed pages, but tmp/ and
      # any server-side .env are excluded: cPanel owns those.
      - name: Upload
        id: upload
        run: |
          rsync -az --delete \
            --exclude 'tmp/' \
            --exclude '.env' \
            --exclude '.htaccess' \
            --exclude '.well-known/' \
            -e "ssh -p ${{ secrets.DEPLOY_SSH_PORT }} -i ~/.ssh/id_ed25519" \
            .next/standalone/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      # Migrations run BEFORE the restart, so a schema change lands while the
      # OLD process is still answering requests and the restart brings up code
      # that expects it. The reverse order leaves a window where new code
      # queries a column that does not exist yet.
      #
      # Run on the RUNNER through an SSH tunnel, not on the server.
      #
      # The obvious version — ssh in and `node scripts/migrate.mjs` — fails
      # with "Cannot find package 'mysql2'". Next bundles mysql2 into its own
      # server chunks, so the APP is fine, but the standalone output's
      # node_modules holds only next, react and react-dom. A plain script sitting
      # beside it can import none of them. Shipping mysql2 and its nine
      # dependencies through pnpm's symlink farm is the same fragility that
      # already cost us a CI-only failure with next-mdx-remote.
      #
      # The runner already has mysql2 from `pnpm install`. Forwarding a local
      # port to the server's MySQL means the migrator runs where its dependency
      # lives, and the database still only ever accepts local connections —
      # from its own perspective the tunnel IS localhost.
      - name: Migrate the production database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "13306"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          # -f backgrounds after auth, -N runs no remote command.
          ssh -f -N -L 13306:127.0.0.1:3306 \
            -p "${{ secrets.DEPLOY_SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          # Give the forward a moment to accept connections.
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/13306) >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/migrate.mjs

      - name: Restart the Passenger app
        run: |
          ssh -p "${{ secrets.DEPLOY_SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p ${{ secrets.DEPLOY_PATH }}/tmp && touch ${{ secrets.DEPLOY_PATH }}/tmp/restart.txt"

      # A deploy that uploads cleanly but leaves the app dead is the failure
      # mode worth catching here rather than from a user report. Skipped on the
      # first run, when the cPanel app is deliberately still stopped.
      # Matches on Next's BUILD_ID, which changes every build and appears in the
      # served markup. A bare 200 was not enough: if Passenger never picked up
      # the restart, the PREVIOUS build answers 200 perfectly happily and the
      # check passed while the new release was not live at all. Nothing extra is
      # published to do this — the id is already in the HTML.
      - name: Verify the site is serving the new build
        if: inputs.skip_live_check != true
        run: |
          BUILD_ID="$(cat .next/BUILD_ID)"
          echo "expecting build $BUILD_ID"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/live.html -w "%{http_code}" "${{ secrets.SITE_URL }}/en" || true)
            if [ "$code" = "200" ] && grep -q "$BUILD_ID" /tmp/live.html; then
              echo "live and serving $BUILD_ID"
              exit 0
            fi
            if [ "$code" = "200" ]; then
              echo "attempt $i: HTTP 200 but still the previous build — waiting for Passenger"
            else
              echo "attempt $i: HTTP $code — waiting for Passenger to respawn"
            fi
            sleep 6
          done
          echo "site did not serve build $BUILD_ID after restart"
          exit 1

      # Uploading cleanly and leaving the site down is the worst outcome: the old
      # build is already gone. Put it back rather than leave production broken
      # while someone reads the logs.
      #
      # Gated on the UPLOAD having succeeded, not merely on the job failing.
      # `$APP.prev` survives a successful deploy, so a bare `failure()` meant a
      # failure that never touched the server — a type error in the standalone
      # build, a missing secret — would still find last release's snapshot and
      # "roll back" a perfectly healthy site to the version before it.
      - name: Roll back if the site is not serving
        if: >-
          failure() &&
          steps.upload.outcome == 'success' &&
          inputs.skip_live_check != true
        run: |
          ssh -p "${{ secrets.DEPLOY_SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             APP='${{ secrets.DEPLOY_PATH }}'
             if [ -d \"\$APP.prev\" ]; then
               rm -rf \"\$APP.broken\"
               mv \"\$APP\" \"\$APP.broken\"
               mv \"\$APP.prev\" \"\$APP\"
               mkdir -p \"\$APP/tmp\" && touch \"\$APP/tmp/restart.txt\"
               echo 'rolled back to the previous release'
             else
               echo 'NO SNAPSHOT — cannot roll back automatically'
               exit 1
             fi"
          echo "::error::Deploy failed its live check and was rolled back. The failed build is at DEPLOY_PATH.broken for inspection."

      - name: Note when the live check was skipped
        if: inputs.skip_live_check == true
        run: |
          echo "::notice::Upload finished. The live check was skipped, so nothing was verified to be serving."
          echo "::notice::Start the app in cPanel → Setup Node.js App, then follow docs/CUTOVER.md Phase 4.4."
