name: CI

on:
  push:
    branches: [main]
    paths:
      - "next-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (saves minutes on rapid pushes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Prevent husky from running install hooks in CI
env:
  HUSKY: "0"

# All run steps execute inside next-app/ by default
defaults:
  run:
    working-directory: ./next-app

jobs:
  # ── Job 1: Type · Lint · Format ──────────────────────────────────────────
  quality:
    name: "Quality (typecheck · lint · format)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript — tsc --noEmit
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier — format check
        run: pnpm format:check

  # ── Job 2: Build ─────────────────────────────────────────────────────────
  build:
    name: "Build (next build)"
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Cache the .next/cache directory across builds to speed up compilation
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: next-app/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('next-app/pnpm-lock.yaml') }}-${{ hashFiles('next-app/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('next-app/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
