name: Diagnose production

# Read-only. Manually triggered. Never writes to the server, never restarts the
# app, never touches the database. Added 2026-09-12 while bangicode.ma was
# returning 500 after a rolled-back deploy and neither SSH nor cPanel was
# reachable from the operator's network. Delete this file once the incident is
# closed.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: "Read the server state"
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        env:
          HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      # Every command below only reads. No secret values are printed.
      - name: Trace the missing module
        run: |
          ssh -p "${{ secrets.DEPLOY_SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "APP='${{ secrets.DEPLOY_PATH }}'

             echo '===== WHEN DID IT START ====='
             echo -n 'stderr.log size: '; wc -c < \"\$APP/stderr.log\"
             echo -n 'occurrences of the swc error: '
             grep -c '_interop_require_default' \"\$APP/stderr.log\" 2>/dev/null || echo 0
             echo
             echo '--- first 25 lines of stderr.log ---'
             head -25 \"\$APP/stderr.log\" 2>/dev/null
             echo
             echo '--- first line number mentioning the swc error ---'
             grep -n '_interop_require_default' \"\$APP/stderr.log\" 2>/dev/null | head -2
             echo
             echo '===== IS @swc/helpers ON DISK (restored release) ====='
             ls -la \"\$APP/node_modules/@swc/\" 2>&1 | head -10
             echo '--- helpers dir ---'
             ls -la \"\$APP/node_modules/@swc/helpers/\" 2>&1 | head -15
             echo '--- helpers/_ subpath (the one that fails) ---'
             ls \"\$APP/node_modules/@swc/helpers/_/\" 2>&1 | head -10
             echo '--- helpers package.json exports ---'
             head -40 \"\$APP/node_modules/@swc/helpers/package.json\" 2>&1
             echo
             echo '===== SAME CHECK ON THE FAILED BUILD ====='
             ls -la \"\$APP.broken/node_modules/@swc/\" 2>&1 | head -10
             ls \"\$APP.broken/node_modules/@swc/helpers/_/\" 2>&1 | head -5
             echo
             echo '===== SYMLINK SHAPE OF node_modules ====='
             ls -la \"\$APP/node_modules/\" 2>&1 | head -15
             echo -n 'has .pnpm store: '
             if [ -d \"\$APP/node_modules/.pnpm\" ]; then echo yes; else echo NO; fi
             echo -n 'broken symlinks under node_modules (first 10): '
             echo
             find \"\$APP/node_modules\" -maxdepth 3 -xtype l 2>/dev/null | head -10
             echo
             echo '===== WHAT NODE DOES PASSENGER USE ====='
             ls -la \$HOME/nodevenv/bangicode-app/ 2>/dev/null
             \$HOME/nodevenv/bangicode-app/22/bin/node -v 2>&1 || echo '(nodevenv node not runnable)'
            "
